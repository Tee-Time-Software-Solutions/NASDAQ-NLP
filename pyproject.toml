[project]
name = "nasdaq-nlp"
version = "0.1.0"
description = "Asymmetric shareholder meeetings sentiment effects on NASDAQ stock prices — NLP research project"
requires-python = ">=3.10"


dependencies = [
    # --- Data / numerics ---
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",    

    # --- Market data ---
    "yfinance>=0.2.48",  

    # --- NLP core ---
    "nltk>=3.8",
    "spacy>=3.7",
    "scikit-learn>=1.3",     
    "gensim>=4.3",           

    # --- Transformer / FinBERT ---
    "transformers>=4.38",
    "torch>=2.1",            

    # --- Regression ---
    "statsmodels>=0.14",     

    # --- Notebook / visualisation ---
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",

    # --- Utilities ---
    "python-dotenv>=1.0",
    "tqdm>=4.66",           
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",             # linting + formatting
    "pytest>=8.0",           # unit tests (milestone later)
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors, pyflakes, isort
ignore = ["E501"]                # line-length already enforced via formatter
